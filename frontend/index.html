65}.avatar{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#333}.assistant .avatar{background:#fff;color:#111}.body{white-space:pre-wrap;min-width:0}.trace{font:12px/1.6 Consolas,monospace;color:#999;background:#202020;border:1px solid var(--line);padding:9px 12px;border-radius:9px;margin-top:9px}.trace b{color:var(--accent)}.trace-log{max-height:150px;overflow-y:auto;overscroll-behavior:contain;padding-right:5px;scrollbar-color:#555 transparent}.trace-line{padding:4px 0;border-top:1px solid #2c2c2c;white-space:pre-wrap}.trace-line:first-child{border-top:0}.trace-agent{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.03em;background:#2f2f2f;color:#bbb;border:1px solid #454545}.trace-agent.mainagent{color:#8fd3ff;border-color:#2c4d63}.trace-agent.searchagent{color:#7ee0a8;border-color:#295c40}.trace-agent.shopagent{color:#ffcf7a;border-color:#63481f}.trace-agent.memory{color:#d6a8ff;border-color:#4b3468}.results{margin-top:26px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid var(--line);border-radius:10px;background:#202020;padding:12px;min-height:180px;display:flex;flex-direction:column}.card h3{font-size:13px;margin:6px 0;line-height:1.45}.muted{color:var(--muted);font-size:12px}.price{font-size:18px;font-weight:700;margin-top:auto}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.actions button,.panel button{border:1px solid #484848;background:#303030;color:#ddd;border-radius:6px;padding:5px 8px;cursor:pointer}.actions .primary{background:var(--accent);border-color:var(--accent);color:#071b13;font-weight:700}.danger{color:#ff9a9a!important}.panel{border:1px solid var(--line);background:#1d1d1d;border-radius:12px;padding:18px;overflow:auto}.panel h2{font-size:16px;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #303030;padding:10px 0}.product-preview{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#222}.product-preview h3{margin:0;font-size:15px}.product-preview .preview-price{grid-column:2;grid-row:1 / span 2;font-size:22px;font-weight:750;color:#fff;white-space:nowrap}.product-preview .preview-desc{color:#aaa;font-size:13px}.success{color:var(--accent);font-weight:700;margin-bottom:12px}.table-wrap{width:100%;overflow-x:auto}.compare,.answer-table,.data-table{border-collapse:collapse;width:100%;font-size:12px}.compare th,.compare td,.answer-table th,.answer-table td,.data-table th,.data-table td{border:1px solid #3b3b3b;padding:8px;text-align:left;vertical-align:top}.compare th,.answer-table th,.data-table th{color:#bbb;background:#242424}.compare th{cursor:pointer}.assistant-content{white-space:normal;overflow-x:auto}.assistant-content>div{margin:3px 0}.assistant-content a{color:var(--accent);text-decoration:underline;word-break:break-all}.assistant-content ul.answer-list{margin:6px 0;padding-left:20px}.assistant-content ul.answer-list li{margin:3px 0;list-style:disc}.assistant-content code{background:#2a2a2a;border-radius:4px;padding:1px 5px;font-size:12px}.answer-table a{color:var(--accent);text-decoration:underline}.answer-table{margin:10px 0;font-size:14px;min-width:560px}.data-table{min-width:820px}.data-table .desc{min-width:180px;max-width:330px;color:#aaa}.data-table .nowrap{white-space:nowrap}.table-summary{display:flex;justify-content:flex-end;gap:24px;margin-top:12px}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}.composer-wrap{position:fixed;left:265px;right:0;bottom:0;padding:28px 20px 22px;background:linear-gradient(transparent,#171717 32%)}.composer{width:min(1050px,100%);margin:auto;display:flex;align-items:flex-end;background:#252525;border:1px solid #494949;border-radius:14px;padding:10px}.composer textarea{flex:1;resize:none;border:0;outline:0;color:#fff;background:transparent;min-height:34px}.composer button{background:#fff;color:#111;border:0;border-radius:9px;padding:9px 13px}.status{width:min(1050px,100%);margin:6px auto;color:#888;font-size:12px}.modal{position:fixed;inset:0;z-index:30;background:#000a;display:grid;place-items:center;padding:24px}.modal[hidden]{display:none}.modal-card{width:min(1180px,100%);max-height:82vh;overflow:auto;background:#181818;border:1px solid #484848;border-radius:14px;box-shadow:0 24px 80px #000;padding:16px}.modal-head{display:flex;justify-content:flex-end}.modal-close{border:0;background:#303030;color:#ddd;border-radius:7px;padding:6px 10px;cursor:pointer}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.composer-wrap{left:0}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><button class="sidebar-scrim" onclick="toggleSidebar(false)" aria-label="关闭侧栏"></button><aside class="sidebar"><button class="brand" onclick="newSession()"><span class="brand-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 8h13l-1 11h-11l-1-11Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/><path d="m12 12 1.1 1.1L12 14.2l-1.1-1.1L12 12Z"/></svg></span><span class="brand-copy">Shopping Agent 工作台</span></button><button class="new" onclick="newSession()">＋ 新建购物会话</button><div class="nav"><button onclick="showFavorites()"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 8.3c0 4.2-8.6 10-8.6 10s-8.6-5.8-8.6-10a4.3 4.3 0 0 1 8.6 0 4.3 4.3 0 0 1 8.6 0Z"/></svg></span><span class="nav-label">收藏</span><span id="favoriteCount" class="nav-count">0</span></button><button onclick="showCart()"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.1 11h11.1l2-8H6"/><path d="M8 19h.01M18 19h.01"/></svg></span><span class="nav-label">购物车</span><span id="cartCount" class="nav-count">0</span></button><button onclick="showOrders()"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10a2 2 0 0 1 2 2v15l-2.5-1.6-2.5 1.6-2.5-1.6L9 20.5l-2-1.6-2 1.6v-15a2 2 0 0 1 2-2Z"/><path d="M9 8h6M9 12h6"/></svg></span><span class="nav-label">订单</span><span id="orderCount" class="nav-count">0</span></button><button onclick="showMemory()"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c-4.7 0-8 3.3-8 8s3.3 8 8 8 8-3.3 8-8Z"/><path d="M12 7.5v8M8 11.5h8M9.2 8.7l5.6 5.6"/></svg></span><span class="nav-label">长期记忆</span><span id="memoryCount" class="nav-count">0</span></button><button onclick="showTraces()"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6v5h5M5.4 11a7.2 7.2 0 1 1 1.5 5.8"/><path d="M12 7.5v4.5l3 2"/></svg></span><span class="nav-label">轨迹回放</span><span id="traceCount" class="nav-count">0</span></button></div><div class="muted">对话历史</div><div id="history" class="history grow"></div><div class="muted">本地模拟购物 · 不产生真实支付</div></aside><main class="main"><header class="top"><div class="top-title"><button id="sidebarToggle" class="sidebar-toggle" onclick="toggleSidebar()" aria-label="打开侧栏" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><strong>Shopping Agent</strong></div><button id="clearSession" class="clear-session" onclick="clearSession()" title="清空当前对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2m-9 0 1 13h10l1-13M10 11v5m4-5v5"/></svg><span>清空会话</span></button></header><section class="chat"><div id="welcome" class="welcome"><h1>今天想找什么？</h1><p>可继续说“把第二件加入购物车”或“立即购买第一件”。</p></div><div id="messages" class="messages"></div><div id="sidePanel"></div></section><div class="composer-wrap"><div class="composer"><textarea id="query" rows="1" placeholder="描述品类、预算和用途"></textarea><button id="send" class="send-button" onclick="recommend()" aria-label="发送消息" title="发送消息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="m12 13 7-8"/></svg></button></div><div id="status" class="status">Enter 发送 · Shift+Enter 换行</div></div></main></div>
<script>
const $=id=>document.getElementById(id),API=location.protocol==='file:'?'http://127.0.0.1:8000':'';let sid=localStorage.getItem('shopping.session');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(API+url,{headers:{'Content-Type':'application/json'},...opt}),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}const encoded=p=>encodeURIComponent(JSON.stringify(p)).replace(/'/g,'%27'),decoded=x=>JSON.parse(decodeURIComponent(x));function splitRow(line){const s=line.trim(),cells=[];let cur='',i=s.startsWith('|')?1:0;for(;i<s.length;i++){const ch=s[i];if(ch==='\\'&&s[i+1]==='|'){cur+='|';i++;continue}if(ch==='|'){cells.push(cur);cur='';continue}cur+=ch}cells.push(cur);while(cells.length&&cells[cells.length-1]==='')cells.pop();return cells.map(v=>v.trim())}function isTableDivider(line){const cells=splitRow(line);return cells.length>0&&cells.every(c=>/^:?-+:?$/.test(c)||/^=+$/.test(c))}function inlineMd(text){return esc(text).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}function renderRichText(text){const lines=String(text??'').replace(/\r/g,'').split('\n'),out=[];for(let i=0;i<lines.length;){if(lines[i].includes('|')&&i+1<lines.length&&isTableDivider(lines[i+1])){const headers=splitRow(lines[i]);i+=2;const rows=[];while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows.push(splitRow(lines[i++]));}const width=headers.length;out.push(`<div class="table-wrap"><table class="answer-table"><thead><tr>${headers.map(c=>`<th>${inlineMd(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${Array.from({length:width},(_,n)=>`<td>${inlineMd(r[n]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue}if(/^\s*[-*]\s+/.test(lines[i])){const items=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){items.push(inlineMd(lines[i++].replace(/^\s*[-*]\s+/,'')))}out.push(`<ul class="answer-list">${items.map(t=>`<li>${t}</li>`).join('')}</ul>`);continue}out.push(lines[i]?`<div>${inlineMd(lines[i])}</div>`:'<br>');i++}return out.join('')}async function ensure(){if(!sid){const s=await api('/api/sessions',{method:'POST'});sid=s.id;localStorage.setItem('shopping.session',sid)}try{await load()}catch(err){if(!String(err.message).includes('会话不存在'))throw err;sid=null;localStorage.removeItem('shopping.session');const s=await api('/api/sessions',{method:'POST'});sid=s.id;localStorage.setItem('shopping.session',sid);await load()}}function resetConversationView(){ $('messages').replaceChildren();$('welcome').hidden=false;closeModal()}async function load(){const d=await api('/api/sessions/'+sid);resetConversationView();$('welcome').hidden=!!d.messages.length;d.messages.forEach(m=>message(m.role,m.content,m.products,m.trace));loadCounts(d);await history()}function traceHtml(t=[]){return traceCard(t.map(traceLine).join(''))}function traceCard(inner,live=false){return inner||live?`<section class="trace"><button type="button" class="trace-toggle" aria-expanded="true" onclick="toggleTrace(this)"><span class="trace-label">${live?'AI已思考0s':'AI思考完成'}</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg></button><div class="trace-log${live?' traceRows':''}">${inner}</div></section>`:''}function toggleTrace(button){const log=button.nextElementSibling,open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));log.hidden=!open;if(open)log.scrollTop=log.scrollHeight}function traceLine(x){if(!x)return'';let text=typeof x==='string'?x:x.content;if(!text)return'';let agent=typeof x==='object'?(x.agent||traceAgentOf(text)):traceAgentOf(text);if(/^(?:SearchAgent|ShopAgent) · (?:product_search|get_product_details|read_state|add_to_cart|buy_now|shop_action)\(/.test(text)){text=text.replace(/^(?:SearchAgent|ShopAgent) · /,'MainAgent · ');agent='MainAgent'}const meta=agent?`<span class="trace-agent ${esc(agent.toLowerCase())}">${esc(agent)}</span>`:'';const detail=agent&&text.startsWith(agent+' · ')?text.slice(agent.length+3):text;return `<div class="trace-line">${meta}${esc(detail)}</div>`}function traceAgentOf(text){const m=String(text).match(/^(MainAgent|SearchAgent|ShopAgent|Memory)\b/);return m?m[1]:''}function message(role,text,products=[],trace=[]){const e=document.createElement('article');e.className='message '+role;const content=role==='assistant'?`<div class="assistant-content">${renderRichText(text)}</div>`:esc(text);e.innerHTML=`<div class="body">${role==='assistant'?traceHtml(trace):''}${content}</div>`;$('messages').appendChild(e);if(role==='assistant')renderProducts(products,e.querySelector('.body'));const log=e.querySelector('.trace-log');if(log)log.scrollTop=log.scrollHeight;}
function renderProducts(ps,host){if(!host||!ps?.length)return;const section=document.createElement('section');section.className='results';section.innerHTML=`<div class="results-heading"><span>为你推荐</span><small>${Math.min(ps.length,8)} 件商品</small></div><div class="grid">${ps.slice(0,8).map(p=>`<article class="card"><div class="muted">${esc(p.category||'商品')} · ${esc(p.brand||'品牌未提供')}</div><h3>${esc(p.title)}</h3><div class="price">¥${Number(p.price||0).toFixed(2)}</div><div class="muted">${esc((p.description||'描述未提供').slice(0,70))}</div><div class="actions"><button onclick="addCart('${encoded(p)}')">购物车</button><button class="primary" onclick="showBuyNow('${encoded(p)}')">立即购买</button><button onclick="favorite('${encoded(p)}')">收藏</button></div></article>`).join('')}</div>`;host.appendChild(section)}
async function recommend(){const q=$('query').value.trim();if(!q)return;$('send').disabled=true;$('welcome').hidden=true;message('user',q);$('query').value='';const e=document.createElement('article');e.className='message assistant';e.innerHTML=`<div class="body">${traceCard('',true)}<div class="answer assistant-content"></div></div>`;$('messages').appendChild(e);const startedAt=performance.now(),thoughtLabel=e.querySelector('.trace-label');const tick=()=>{thoughtLabel.textContent='AI已思考'+Math.floor((performance.now()-startedAt)/1000)+'s'};tick();const timer=setInterval(tick,250);let completed=false;try{const r=await fetch(API+'/api/recommend/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,query:q,top_k:8})});if(!r.ok||!r.body)throw Error('流式请求失败');const rd=r.body.getReader(),dc=new TextDecoder();let buf='',done;while(true){const c=await rd.read();buf+=dc.decode(c.value||new Uint8Array(),{stream:!c.done});const ls=buf.split('\n');buf=ls.pop()||'';for(const line of ls){if(!line.trim())continue;const x=JSON.parse(line);if(x.type==='progress'){const log=e.querySelector('.traceRows'),stickToLatest=log.scrollHeight-log.scrollTop-log.clientHeight<24;let row=Array.from(log.querySelectorAll('.live-progress')).find(n=>n.dataset.agent===x.agent);if(!row){row=document.createElement('div');row.className='trace-line live-progress';row.dataset.agent=x.agent;log.appendChild(row)}row.textContent=x.content;if(stickToLatest)log.scrollTop=log.scrollHeight;$('status').textContent=x.content}else if(x.type==='trace'){const log=e.querySelector('.traceRows'),stickToLatest=log.scrollHeight-log.scrollTop-log.clientHeight<24;Array.from(log.querySelectorAll('.live-progress')).find(n=>n.dataset.agent===x.agent)?.remove();log.insertAdjacentHTML('beforeend',traceLine(x));if(stickToLatest)log.scrollTop=log.scrollHeight;$('status').textContent=x.content}else if(x.type==='delta')e.querySelector('.answer').textContent+=x.content;else if(x.type==='done'){e.querySelectorAll('.live-progress').forEach(n=>n.remove());done=x.result;}else if(x.type==='error')throw Error(x.message)}if(c.done)break}if(!done)throw Error('响应未结束');e.querySelector('.answer').innerHTML=renderRichText(done.answer);renderProducts(done.products||[],e.querySelector('.body'));completed=true;clearInterval(timer);thoughtLabel.textContent='AI思考完成';$('status').textContent='已完成';await loadCounts();await history()}catch(err){if(!completed)thoughtLabel.textContent='AI思考中断';e.querySelector('.answer').textContent||='请求未完成';$('status').textContent='失败：'+err.message}finally{clearInterval(timer);$('send').disabled=false}}
async function history(){const d=await api('/api/sessions');$('history').innerHTML=d.sessions.map(s=>`<div class="history-item ${s.id===sid?'active':''}"><button class="history-main" onclick="switchSession('${s.id}')" title="${esc(s.title)}">${esc(s.title)}</button><button class="history-delete" onclick="deleteSession('${s.id}')" title="删除会话" aria-label="删除会话">×</button></div>`).join('');return d.sessions}async function newSession(){const s=await api('/api/sessions',{method:'POST'});sid=s.id;localStorage.setItem('shopping.session',sid);resetConversationView();await loadCounts();await history()}async function switchSession(id){sid=id;localStorage.setItem('shopping.session',sid);await load()}async function clearSession(){if($('send').disabled)return;if(!confirm('清空当前会话的对话与推荐商品？'))return;try{await api('/api/sessions/'+sid+'/clear',{method:'POST'});await load();$('status').textContent='当前会话已清空'}catch(err){$('status').textContent='清空失败：'+err.message}}async function deleteSession(id){if($('send').disabled)return;if(!confirm('确认删除这个会话及其对话记录？购物车、收藏、订单和长期记忆会保留。'))return;try{await api('/api/sessions/'+id,{method:'DELETE'});const sessions=await history();if(sessions.some(s=>s.id===id))throw Error('服务端仍返回此会话，请重启服务后重试');if(id===sid){if(sessions.length){sid=sessions[0].id;localStorage.setItem('shopping.session',sid);await load()}else await newSession()}else await history();$('status').textContent='会话已删除'}catch(err){$('status').textContent='删除失败：'+err.message}}
function productDescription(p){return p.description||p.features||p.attributes&&JSON.stringify(p.attributes)||'数据集未提供'}function productMeta(p){return [p.brand,p.category].filter(Boolean).join(' / ')||'数据集未提供'}function productPreview(p){return `<div class="product-preview"><h3>${esc(p.title||'未命名商品')}</h3><div class="preview-desc">${esc(productMeta(p))}<br>${esc(productDescription(p))}</div><div class="preview-price">¥${Number(p.price||0).toFixed(2)}</div></div>`}async function addCart(x){const p=decoded(x);await api('/api/cart',{method:'POST',body:JSON.stringify({session_id:sid,product:p})});$('status').textContent='已加入购物车';await loadCounts();panel('购物车',`<div class="success">✓ 成功加入购物车</div>${productPreview(p)}<div class="actions"><button onclick="showCart()">查看购物车</button></div>`)}function showBuyNow(x){const p=decoded(x);panel('确认立即购买',`${productPreview(p)}<div class="muted">将直接生成已确认的本地模拟订单，不产生真实付款。</div><div class="actions"><button class="primary" onclick="confirmBuyNow('${x}')">立即购买</button><button onclick="closeModal()">取消</button></div>`)}async function confirmBuyNow(x){const p=decoded(x),d=await api('/api/buy-now',{method:'POST',body:JSON.stringify({session_id:sid,product:p})});$('status').textContent=`订单 ${d.id} 已生成`;await loadCounts();panel('购买成功',`<div class="success">✓ 已生成模拟订单 ${esc(d.id)}</div>${productPreview(p)}<div class="actions"><button onclick="showOrders()">查看订单</button></div>`)}async function favorite(x){const p=decoded(x);await api('/api/favorites',{method:'POST',body:JSON.stringify({session_id:sid,product:p})});$('status').textContent='已收藏';await loadCounts();panel('收藏',`<div class="success">♡ 收藏成功</div>${productPreview(p)}<div class="actions"><button onclick="showFavorites()">查看收藏</button></div>`)}async function loadCounts(state){const d=state||await api('/api/sessions/'+sid);$('favoriteCount').textContent=d.favorites.length;$('cartCount').textContent=d.cart.reduce((n,p)=>n+p.quantity,0);$('orderCount').textContent=d.orders.length;$('traceCount').textContent=d.trace_count||0;try{const m=await api('/api/memory/'+sid);$('memoryCount').textContent=m.count}catch(e){$('memoryCount').textContent=0}}async function remove(kind,id){await api(`/api/${kind}/${sid}/${encodeURIComponent(id)}`,{method:'DELETE'});({cart:showCart,favorites:showFavorites}[kind])();await loadCounts()}function panel(title,body){$('modalBody').innerHTML=`<section class="panel"><h2>${esc(title)}</h2>${body}</section>`;$('modal').hidden=false}function closeModal(){const m=$('modal');if(m)m.hidden=true}
function emptyShop(message){return `<div class="shop-empty">${esc(message)}</div>`}function money(value){return `¥${Number(value||0).toFixed(2)}`}function shopItem(p,meta,amount,note,action=''){return `<div class="shop-item"><div class="shop-item-main"><div class="shop-item-title">${esc(p.title||'未命名商品')}</div><div class="shop-item-meta">${esc(meta)}</div></div><div class="shop-item-price">${money(amount)}${note?`<small>${esc(note)}</small>`:''}</div>${action?`<div class="shop-item-action">${action}</div>`:''}</div>`}async function showCart(){const d=await api('/api/cart/'+sid);const body=d.items.length?`<div class="shop-list">${d.items.map(p=>shopItem(p,`${productMeta(p)} · 数量 ${p.quantity}`,Number(p.price||0)*Number(p.quantity||0),`单价 ${money(p.price)}`,`<button class="danger" onclick="remove('cart',decoded('${encoded(p.product_id)}'))">移出</button>`)).join('')}</div><div class="shop-summary"><span>共 ${d.total_quantity} 件 · 合计</span><strong>${money(d.total_price)}</strong></div><div class="actions"><button class="shop-primary" onclick="createOrder()">生成模拟订单</button></div>`:emptyShop('购物车还是空的');panel('购物车',`<p class="modal-subtitle">所有会话共享 · ${d.total_quantity} 件商品</p>${body}`)}async function showFavorites(){const d=await api('/api/favorites/'+sid);const body=d.items.length?`<div class="shop-list">${d.items.map(p=>shopItem(p,productMeta(p),p.price,'',`<button class="danger" onclick="remove('favorites',decoded('${encoded(p.product_id)}'))">取消收藏</button>`)).join('')}</div>`:emptyShop('还没有收藏商品');panel('收藏',`<p class="modal-subtitle">所有会话共享 · ${d.items.length} 件商品</p>${body}`)}
async function showMemory(){const d=await api('/api/memory/'+sid);const kindLabel={budget:'预算',brand:'品牌',category:'品类',attribute:'属性',constraint:'约束',fact:'事实'};panel('长期记忆（Agent 自动记录）',`<p class="modal-subtitle">跨会话共享 · Agent 每轮自动抽取，共 ${d.count} 条</p>`+(d.items.length?`<div class="shop-list">${d.items.map(m=>`<div class="row"><span><span class="trace-agent memory">${esc(kindLabel[m.kind]||m.kind)}</span>${esc(m.content)}</span><button class="danger" onclick="deleteMemory(${m.id})">删除</button></div>`).join('')}</div>`:'暂无长期记忆，继续对话后 Agent 会自动沉淀')+`<div class="actions"><button class="danger" onclick="clearMemory()">清空全部记忆</button></div>`)}
async function deleteMemory(id){await api(`/api/memory/${sid}/${id}`,{method:'DELETE'});await loadCounts();showMemory()}
async function clearMemory(){if(confirm('确认清空全部长期记忆？')){await api('/api/memory/'+sid,{method:'DELETE'});await loadCounts();showMemory()}}
async function createOrder(){try{const d=await api('/api/orders/'+sid,{method:'POST'});$('status').textContent=`${d.id} 已从购物车创建`;await loadCounts();await showOrders()}catch(err){$('status').textContent='建单失败：'+err.message}}async function orderAction(id,a){try{await api(`/api/orders/${sid}/${id}/${a}`,{method:'POST'});await loadCounts();await showOrders()}catch(err){$('status').textContent='订单操作失败：'+err.message}}async function showOrders(){const d=await api('/api/orders/'+sid),statusText={DRAFT:'待确认',CONFIRMED:'已确认',CANCELLED:'已取消'};const cards=d.items.map(o=>{const items=o.items||[],total=items.reduce((sum,p)=>sum+Number(p.price||0)*Number(p.quantity||1),0),id=encoded(o.id),actions=o.status==='DRAFT'?`<button onclick="orderAction(decoded('${id}'),'confirm')">确认订单</button> <button class="danger" onclick="orderAction(decoded('${id}'),'cancel')">取消</button>`:`<button onclick="orderAction(decoded('${id}'),'rebuy')">再次购买</button>`;return `<section class="order-card"><div class="order-head"><span class="order-id">订单 ${esc(o.id)}</span><span class="order-status ${esc(o.status)}">${statusText[o.status]||esc(o.status)}</span></div><div class="order-products">${items.map(p=>shopItem(p,`数量 ${p.quantity||1}`,Number(p.price||0)*Number(p.quantity||1),`单价 ${money(p.price)}`)).join('')||emptyShop('订单商品数据缺失')}</div><div class="order-foot"><span>${esc(o.created_at||'')}</span><span>合计 <strong class="shop-item-price">${money(total)}</strong></span><span>${actions}</span></div></section>`}).join('');panel('订单',`<p class="modal-subtitle">所有会话共享 · ${d.items.length} 笔模拟订单</p>${cards?`<div class="shop-list">${cards}</div>`:emptyShop('还没有订单')}`)}async function showTraces(){const d=await api(`/api/traces/${sid}/replay`);panel('完整运行轨迹回放',d.events.length?d.events.map(e=>`<div class="trace"><b>${esc(e.run_id)} / ${esc(e.tool)}</b><div>${esc(e.args)}</div><div>耗时 ${e.elapsed_ms} ms · input ${e.metrics?.input_tokens||0} · output ${e.metrics?.output_tokens||0}</div></div>`).join(''):'暂无轨迹')}
